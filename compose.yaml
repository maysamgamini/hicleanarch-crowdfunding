# Local development: PostgreSQL 17, as on Aurora, and Valkey 8, as on ElastiCache. Start with `docker compose up -d`.
#
# The profile `stack` adds the rest of what runs in ECS, wired the same way: Moto for SNS and SQS, the
# migration tasks, the monolith, the Payments service (s4-l10) and the gateway in front of them. Start it with scripts/local-up.sh,
# which provisions the topics and queues first, and test it with scripts/local-smoke.sh. Nothing in it
# reaches AWS: every endpoint is a service of this file (local-up.sh checks), and the AWS SDK's
# endpoint is Moto's. Every image is free software, at a pinned version.

x-aws-local: &aws-local
  # Any AWS client the hosts build goes to Moto, with throwaway credentials, never to AWS.
  AWS_ENDPOINT_URL: http://moto:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

x-module-connections: &module-connections
  # The modules' own logins, as the secrets in infra/env/secrets.tf hold them; `migrate` creates them.
  # Without TLS here, Npgsql would first offer GSS encryption, which the image has no library for.
  ConnectionStrings__Campaigns: Host=postgres;Port=5432;Database=crowdfunding;Username=campaigns_app;Password=campaigns_dev;GSS Encryption Mode=Disable
  ConnectionStrings__Pledges: Host=postgres;Port=5432;Database=crowdfunding;Username=pledges_app;Password=pledges_dev;GSS Encryption Mode=Disable
  ConnectionStrings__PledgesJobs: Host=postgres;Port=5432;Database=crowdfunding;Username=pledges_jobs;Password=pledges_jobs_dev;GSS Encryption Mode=Disable
  ConnectionStrings__Notifications: Host=postgres;Port=5432;Database=crowdfunding;Username=notifications_app;Password=notifications_dev;GSS Encryption Mode=Disable

# A health check for the .NET images, which have bash but no curl: GET $0 on port 8080 answers 200.
x-http-ok: &http-ok >-
  exec 3<>/dev/tcp/127.0.0.1/8080 &&
  printf 'GET %s HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' "$$0" >&3 &&
  head -n 1 <&3 | grep -q ' 200 '

x-local-auth: &local-auth
  # The local JWT issuer instead of Cognito: tokens signed with this key (`token creator` mints one).
  Auth__ClientId: local-client
  Auth__LocalSigningKey: development-only-signing-key-0123456789abcdef

services:
  postgres:
    image: postgres:17.4 # infra/env: aurora_engine_version
    environment:
      POSTGRES_DB: crowdfunding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "crowdfunding"]
      interval: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.0.12 # infra/env/valkey.tf: engine_version 8.0
    # The users of infra/env/valkey.tf: no default user, so a connection without a user and password
    # can do nothing, and a user per client with its access string. The passwords are for this laptop
    # only; on AWS they are random and kept in Secrets Manager.
    command: [
      "valkey-server",
      "--user", "default", "off",
      "--user", "api", "on", ">api_dev", "~campaigns:*", "~pledges:*", "resetchannels", "-@all",
      "+@connection", "+@read", "+@write", "+@scripting", "-@dangerous", "-scan", "-randomkey",
      "--user", "gateway", "on", ">gateway_dev", "~gateway:*", "&*", "+@all", "-@dangerous", "-scan", "-randomkey",
      "--user", "payments", "on", ">payments_dev", "~buckets:psp:*", "~payments:*", "resetchannels", "-@all",
      "+@connection", "+@read", "+@write", "+@scripting", "+time", "-@dangerous", "-scan", "-randomkey",
    ]
    ports:
      - "${LOCAL_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "--user", "api", "--pass", "api_dev", "--no-auth-warning", "ping"]
      interval: 2s
      retries: 30

  # SNS and SQS. The image the broker tests use (tests/Shared/MotoBroker.cs), Apache 2.0.
  moto:
    profiles: [stack]
    image: motoserver/moto:5.2.3
    ports:
      - "127.0.0.1:${LOCAL_MOTO_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/moto-api/"]
      interval: 2s
      retries: 30

  # What Terraform does in messaging.tf, from events/broker-subscriptions.json (local/broker/provision.py).
  # It prints the addresses the hosts read; scripts/local-up.sh keeps them in .local/broker.env.
  broker-setup:
    profiles: [stack]
    build:
      context: .
      dockerfile: local/broker/Dockerfile
    environment:
      BROKER_ENDPOINT: http://moto:5000
    depends_on:
      moto:
        condition: service_healthy

  # The migration task (infra/env/ecs.tf, aws_ecs_task_definition.migrate): the release image with
  # `migrate`, the owner's connection string and the modules', then it exits.
  migrate:
    profiles: [stack]
    build: .
    command: ["migrate"]
    environment:
      <<: [*aws-local, *module-connections, *local-auth]
      ConnectionStrings__Owner: Host=postgres;Port=5432;Database=crowdfunding;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy

  # Payments' migration task (infra/services/payments, through the service module): Payments.Host with
  # `migrate`, as the owner of Payments' database. Locally that database is the shared one.
  payments-migrate:
    profiles: [stack]
    build: &payments-image
      context: .
      dockerfile: src/Services/Payments.Host/Dockerfile
    command: ["migrate"]
    environment:
      <<: [*aws-local, *local-auth]
      ConnectionStrings__Owner: Host=postgres;Port=5432;Database=crowdfunding;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=crowdfunding;Username=payments_app;Password=payments_dev;GSS Encryption Mode=Disable
      Payments__WebhookSecret: whsec_development_only_0123456789
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The Payments service (infra/services/payments): Payments alone, its events through the broker, the
  # card-setup command from the monolith on 8081.
  payments:
    profiles: [stack]
    build: *payments-image
    environment:
      <<: [*aws-local, *local-auth]
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_SERVICE_NAME: crowdfunding-payments
      ASPNETCORE_HTTP_PORTS: "8080;8081"
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=crowdfunding;Username=payments_app;Password=payments_dev;GSS Encryption Mode=Disable
      ConnectionStrings__Valkey: valkey:6379,user=payments,password=payments_dev,tiebreaker=,configChannel=
      Payments__WebhookSecret: whsec_development_only_0123456789
      Payments__Budget__Prefix: psp
      ForwardedHeaders__KnownNetwork: ${LOCAL_SUBNET:-10.250.0.0/24}
      Auth__ServiceClients__0: local-monolith
      Events__Routes__Pledges: Broker
      Events__Routes__Campaigns: Broker
      Events__Routes__Notifications: Broker
      Events__Broker__Read__0: payments
    env_file:
      - path: .local/broker.env
        required: false
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "dotnet", "CrowdFunding.Payments.Host.dll", "health"]
      interval: 2s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      moto:
        condition: service_healthy
      payments-migrate:
        condition: service_completed_successfully

  # The monolith (infra/env/ecs.tf, local.api_container): Campaigns, Pledges and Notifications; Payments'
  # events through the broker, and StartCardSetup over HTTP to the Payments service.
  api:
    profiles: [stack]
    build: .
    environment:
      <<: [*aws-local, *module-connections, *local-auth]
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_SERVICE_NAME: crowdfunding-api
      Notifications__Sender: InMemory
      ConnectionStrings__Valkey: valkey:6379,user=api,password=api_dev,tiebreaker=,configChannel=
      ForwardedHeaders__KnownNetwork: ${LOCAL_SUBNET:-10.250.0.0/24}
      # The routes of s4-l02 (infra/env/messaging.tf, local.broker_environment); the topics and queues
      # come from .local/broker.env.
      Events__Routes__Payments: Broker
      Events__Producers__Payments__Pledges: Broker
      Events__Producers__Payments__Campaigns: Broker
      Events__Producers__Payments__Notifications: Broker
      Events__Broker__Read__0: monolith
      # s5-l02: every event Notifications consumes comes through its own queue, which the monolith reads
      # while it still runs Notifications.
      Events__Routes__Notifications: Broker
      Events__Broker__Read__1: notifications
      Events__Broker__AlsoServe__monolith__0: Notifications
      # s4-l03 and s4-l10: StartCardSetup goes over HTTP to the Payments service's internal port.
      Modules__Payments__BaseAddress: http://payments:8081
      # s4-l04: the monolith's service identity. Without a token endpoint it signs its service tokens
      # with Auth:LocalSigningKey, as the local issuer does for users; on AWS they come from Cognito.
      ServiceIdentity__ClientId: local-monolith
      Auth__ServiceClients__0: local-monolith
    env_file:
      - path: .local/broker.env
        required: false
    # Only for the fake PSP's side door and debugging; clients go through the gateway.
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-8081}:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", *http-ok, "/health/ready"]
      interval: 2s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      moto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      payments:
        condition: service_healthy

  # The gateway (infra/env/gateway.tf): the only way in.
  gateway:
    profiles: [stack]
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Clusters__monolith__Destinations__monolith__Address: http://api:8080/
      ReverseProxy__Clusters__payments__Destinations__payments__Address: http://payments:8080/
      EdgeLimits__GatewayTasks: "1"
      EdgeLimits__Valkey: valkey:6379,user=gateway,password=gateway_dev
      ForwardedHeaders__KnownNetwork: ${LOCAL_SUBNET:-10.250.0.0/24}
    ports:
      - "127.0.0.1:${LOCAL_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", *http-ok, "/health"]
      interval: 2s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy

networks:
  default:
    # Fixed, so the hosts can trust X-Client-Address and X-Forwarded-For from inside it, as from the VPC.
    ipam:
      config:
        - subnet: ${LOCAL_SUBNET:-10.250.0.0/24}

volumes:
  postgres:
