name: monolith

# The monolith's pipeline, which also owns the shared layer (infra/env: network, cluster, database,
# gateway, Valkey, Cognito, topics and queues): contract tests, then the monolith and the gateway built
# and tested from their solution filter, then (on main) their images pushed with the deploy role and,
# if a sandbox is up, the shared layer and the monolith deployed into it. Since s4-l10 the monolith
# compiles nothing of src/Modules/Payments but Payments.Client (and Payments' Contracts, as a package),
# so a change elsewhere under src/Modules/Payments runs Payments' pipeline only.
# Path filters are not applied to tag pushes: a lesson tag runs every pipeline.
on:
  push:
    branches: [main]
    tags: ["s*-l*"]
    paths:
      - "src/Host/**"
      - "src/Gateway/**"
      - "src/Modules/Campaigns/**"
      - "src/Modules/Pledges/**"
      - "src/Modules/Notifications/**"
      - "src/Modules/Payments/Payments.Client/**"
      - "src/Modules/*/*.Contracts/**"
      - "src/BuildingBlocks/**"
      - "events/subscriptions.json"
      - "infra/env/**"
      - "Dockerfile"
      - "tests/ArchitectureTests/**"
      - "tests/IntegrationTests/**"
      - "tests/Campaigns.UnitTests/**"
      - "tests/Gateway.Tests/**"
      - "tests/Directory.Build.props"
      - "Monolith.slnf"
      - "System.slnf"
      - "Contracts.slnf"
      - "CrowdFunding.slnx"
      - "BuildingBlocks.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
      - "dotnet-tools.json"
      - ".editorconfig"
      - ".dockerignore"
      - "scripts/deploy-monolith.sh"
      - "scripts/run-migration.sh"
      - "scripts/push-image.sh"
      - ".github/workflows/monolith.yml"
      - "src/Messaging/**"
      - "tests/Contracts.ProducerTests/**"
      - "Contracts.slnx"
      - "events/broker-subscriptions.json"
      - "scripts/check-contracts.sh"
      - "scripts/pack-contracts.sh"
      - "src/RemoteCalls/**"
      - "tests/Messaging.Tests/**"
      - "tests/RemoteCalls.Tests/**"
      - "tests/Contracts.ConsumerTests/**"
      - "tests/Shared/**"
  pull_request:
    paths:
      - "src/Host/**"
      - "src/Gateway/**"
      - "src/Modules/Campaigns/**"
      - "src/Modules/Pledges/**"
      - "src/Modules/Notifications/**"
      - "src/Modules/Payments/Payments.Client/**"
      - "src/Modules/*/*.Contracts/**"
      - "src/BuildingBlocks/**"
      - "events/subscriptions.json"
      - "infra/env/**"
      - "Dockerfile"
      - "tests/ArchitectureTests/**"
      - "tests/IntegrationTests/**"
      - "tests/Campaigns.UnitTests/**"
      - "tests/Gateway.Tests/**"
      - "tests/Directory.Build.props"
      - "Monolith.slnf"
      - "System.slnf"
      - "Contracts.slnf"
      - "CrowdFunding.slnx"
      - "BuildingBlocks.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
      - "dotnet-tools.json"
      - ".editorconfig"
      - ".dockerignore"
      - "scripts/deploy-monolith.sh"
      - "scripts/run-migration.sh"
      - "scripts/push-image.sh"
      - ".github/workflows/monolith.yml"
      - "src/Messaging/**"
      - "tests/Contracts.ProducerTests/**"
      - "Contracts.slnx"
      - "events/broker-subscriptions.json"
      - "scripts/check-contracts.sh"
      - "scripts/pack-contracts.sh"
      - "src/RemoteCalls/**"
      - "tests/Messaging.Tests/**"
      - "tests/RemoteCalls.Tests/**"
      - "tests/Contracts.ConsumerTests/**"
      - "tests/Shared/**"

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  contracts:
    # First, so a contract change that would break the other service stops before either builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet pack BuildingBlocks.slnx -o artifacts/packages
      - run: dotnet test Contracts.slnf
      - name: Contract tests, on the Contracts' source (s4-l06)
        run: dotnet test tests/Contracts.ProducerTests
      - name: A contract change since the base carries the version it needs
        # A pull request against its base branch; a push against the commit it follows. A new branch has no base.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-contracts.sh "$BASE"
          fi

  build:
    needs: contracts
    runs-on: ubuntu-latest
    # A hung test fails the job in minutes, not after GitHub's default of six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Pack the BuildingBlocks into the local feed the modules restore from
        # A clean runner: the release version itself, with no stale package cache to worry about.
        run: dotnet pack BuildingBlocks.slnx -o artifacts/packages
      - name: Pack the Contracts, which every module builds against as packages (s4-l06)
        run: dotnet pack Contracts.slnx -o artifacts/packages
      - name: The monolith builds alone, from its solution filter
        run: dotnet build Monolith.slnf
      - name: Test
        # A test that stops making progress is aborted with a dump of what it was doing.
        run: dotnet test Monolith.slnf --no-build --blame-hang-timeout 5m
      - name: The tests that run both services, built from this commit
        # The rule tests start the monolith and Payments.Host side by side (s4-l10): whichever service
        # changed is checked against the other at the same commit.
        run: dotnet test System.slnf --blame-hang-timeout 5m
      - name: Every model change has its migration
        # EF Core 9+ refuses to migrate a model that differs from its last migration; catch it here.
        run: |
          dotnet tool restore
          for project in src/Modules/Campaigns/Campaigns.Infrastructure src/Modules/Pledges/Pledges.Infrastructure \
                         src/Modules/Notifications; do
            dotnet ef migrations has-pending-model-changes --project "$project" --no-build
          done
      - name: The image builds
        run: docker build -q -t crowdfunding-api:ci .
      - name: The gateway image builds
        run: docker build -q -f src/Gateway/Dockerfile -t crowdfunding-gateway:ci .

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    concurrency:
      group: deploy-monolith
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push the images
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          api="$REGISTRY/hicleanarch/crowdfunding-api"
          gateway="$REGISTRY/hicleanarch/crowdfunding-gateway"
          ./scripts/push-image.sh "$api" "$GITHUB_SHA" Dockerfile
          ./scripts/push-image.sh "$gateway" "$GITHUB_SHA" src/Gateway/Dockerfile
          echo "image=$api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      # The sandbox is up while its outputs document exists (infra/env/shared-outputs.tf).
      - name: Is a sandbox up?
        id: sandbox
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if aws s3api head-object --bucket "$STATE_BUCKET" --key env/shared.json >/dev/null 2>&1; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sandbox is up: the images are pushed, nothing is deployed." >> "$GITHUB_STEP_SUMMARY"
          fi
      # A commit that changes both services deploys Payments first: it serves the monolith's calls, and a
      # field the monolith needs from Payments' events ships with Payments. Payments' pipeline runs for
      # this commit only if its paths matched; if it failed, the monolith waits for a fixed commit.
      - name: Payments first, when this commit changes both
        if: steps.sandbox.outputs.up == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow payments.yml --commit "$GITHUB_SHA" \
              --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$run" in
              "") echo "Payments' pipeline does not run for this commit."; exit 0 ;;
              "completed success") exit 0 ;;
              completed*) echo "Payments' pipeline ended '$run' for this commit; the monolith is not deployed." >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "Payments' pipeline did not finish within an hour." >&2
          exit 1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.sandbox.outputs.up == 'true'
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: Deploy the shared layer and the monolith
        if: steps.sandbox.outputs.up == 'true'
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          IMAGE: ${{ steps.image.outputs.image }}
          GATEWAY_IMAGE: ${{ steps.image.outputs.gateway }}
        run: |
          ./scripts/deploy-monolith.sh prepare "$IMAGE" "$GATEWAY_IMAGE"
          ./scripts/deploy-monolith.sh roll "$IMAGE" "$GATEWAY_IMAGE"
