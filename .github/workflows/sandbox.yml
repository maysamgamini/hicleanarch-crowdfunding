name: sandbox

# Apply the sandbox environment, deploy the current main, smoke-test it, destroy it.
# Since s5-l10 no monolith is left, and every run builds the environment from nothing, so it deploys all
# four services (CQA-2116): the shared layer and the gateway (deploy role) with the three one-time
# hand-overs (Pledges, Notifications, Campaigns), then Payments, Pledges, Notifications and Campaigns, each
# as its own deploy role, then the shared layer again with the two route switches on, now that the
# services they point at run (campaigns_serves_routes, notifications_serves_preferences), then the smoke
# test through the gateway. Destroy goes the other way: the services first, the shared layer last.
# Needs the repository variables AWS_DEPLOY_ROLE_ARN, AWS_PAYMENTS_DEPLOY_ROLE_ARN,
# AWS_PLEDGES_DEPLOY_ROLE_ARN, AWS_NOTIFICATIONS_DEPLOY_ROLE_ARN, AWS_CAMPAIGNS_DEPLOY_ROLE_ARN and
# TF_STATE_BUCKET (outputs of infra/bootstrap).
on:
  workflow_dispatch:
    inputs:
      keep_minutes:
        description: "Minutes to keep the environment up after the smoke test (0 = destroy at once)"
        default: "0"
      load_scale:
        description: "Run the Round 2 load profile at this fraction of the loop's rates, e.g. 0.02 (0 = no load test)"
        default: "0"
  schedule:
    - cron: "17 3 * * *" # nightly: destroy anything left up

permissions:
  id-token: write
  contents: read

concurrency:
  group: sandbox
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: inputs.load_scale != '0'

      - name: Push the gateway's image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          gateway="$REGISTRY/hicleanarch/crowdfunding-gateway"
          ./scripts/push-image.sh "$gateway" "$GITHUB_SHA" src/Gateway/Dockerfile
          echo "gateway=$gateway:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLEDGES_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-pledges
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push Pledges' image, as Pledges' deploy role
        id: pledges-image
        env:
          REGISTRY: ${{ steps.ecr-pledges.outputs.registry }}
        run: |
          repository="$REGISTRY/hicleanarch/crowdfunding-pledges"
          ./scripts/push-image.sh "$repository" "$GITHUB_SHA" src/Services/Pledges/Pledges.Host/Dockerfile
          echo "image=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-payments
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push Payments' image, as Payments' deploy role
        id: payments-image
        env:
          REGISTRY: ${{ steps.ecr-payments.outputs.registry }}
        run: |
          repository="$REGISTRY/hicleanarch/crowdfunding-payments"
          ./scripts/push-image.sh "$repository" "$GITHUB_SHA" src/Services/Payments/Payments.Host/Dockerfile
          echo "image=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_NOTIFICATIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-notifications
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push Notifications' image, as Notifications' deploy role
        id: notifications-image
        env:
          REGISTRY: ${{ steps.ecr-notifications.outputs.registry }}
        run: |
          repository="$REGISTRY/hicleanarch/crowdfunding-notifications"
          ./scripts/push-image.sh "$repository" "$GITHUB_SHA" src/Services/Notifications/Notifications.Host/Dockerfile
          echo "image=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_CAMPAIGNS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-campaigns
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push Campaigns' image, as Campaigns' deploy role
        id: campaigns-image
        env:
          REGISTRY: ${{ steps.ecr-campaigns.outputs.registry }}
        run: |
          repository="$REGISTRY/hicleanarch/crowdfunding-campaigns"
          ./scripts/push-image.sh "$repository" "$GITHUB_SHA" src/Services/Campaigns/Campaigns.Host/Dockerfile
          echo "image=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # Since s5-l10 no monolith is left: the shared layer and the gateway first, then each service, Payments
      # before Pledges, which calls it. Each module's schema is handed to its migration role once, by the
      # shared layer's hand-over task (the only one that reads the owner's secret), one at a time, in the
      # local stack's order (compose.yaml). The route switches stay off until their services run.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply the shared layer, and hand the services' schemas over
        env:
          GATEWAY_IMAGE: ${{ steps.image.outputs.gateway }}
          TF_VAR_pledges_image: ${{ steps.pledges-image.outputs.image }}
          TF_VAR_notifications_image: ${{ steps.notifications-image.outputs.image }}
          TF_VAR_campaigns_image: ${{ steps.campaigns-image.outputs.image }}
          TF_VAR_campaigns_serves_routes: "false"
          TF_VAR_notifications_serves_preferences: "false"
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          LOAD_SCALE: ${{ inputs.load_scale || '0' }}
        run: |
          start=$(date +%s)
          edge_limit=20
          if [ "$LOAD_SCALE" != "0" ]; then edge_limit=100000; fi
          TF_VAR_edge_limit_per_second="$edge_limit" ./scripts/deploy-shared.sh "$GATEWAY_IMAGE"
          ./scripts/hand-over.sh pledges
          ./scripts/hand-over.sh notifications
          ./scripts/hand-over.sh campaigns
          echo "The shared layer and the three hand-overs took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Payments, as Payments' deploy role
        env:
          IMAGE: ${{ steps.payments-image.outputs.image }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/deploy-payments.sh "$IMAGE"
          echo "Payments' applies, migration and rollout took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLEDGES_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Pledges, as Pledges' deploy role
        env:
          IMAGE: ${{ steps.pledges-image.outputs.image }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/deploy-service.sh pledges "$IMAGE"
          echo "Pledges' applies, migration and rollout took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_NOTIFICATIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Notifications, as Notifications' deploy role
        env:
          IMAGE: ${{ steps.notifications-image.outputs.image }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/deploy-service.sh notifications "$IMAGE"
          echo "Notifications' applies, migration and rollout took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_CAMPAIGNS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Campaigns, as Campaigns' deploy role
        env:
          IMAGE: ${{ steps.campaigns-image.outputs.image }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/deploy-service.sh campaigns "$IMAGE"
          echo "Campaigns' applies, migration and rollout took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      # Every service runs: the gateway may now send Campaigns' paths and the preference route to theirs.
      # Without this, POST /v1/campaigns goes to the catch-all, the Pledges service, which answers 404.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Send Campaigns' and Notifications' paths to their services
        env:
          GATEWAY_IMAGE: ${{ steps.image.outputs.gateway }}
          TF_VAR_pledges_image: ${{ steps.pledges-image.outputs.image }}
          TF_VAR_notifications_image: ${{ steps.notifications-image.outputs.image }}
          TF_VAR_campaigns_image: ${{ steps.campaigns-image.outputs.image }}
          TF_VAR_campaigns_serves_routes: "true"
          TF_VAR_notifications_serves_preferences: "true"
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          LOAD_SCALE: ${{ inputs.load_scale || '0' }}
        run: |
          edge_limit=20
          if [ "$LOAD_SCALE" != "0" ]; then edge_limit=100000; fi
          TF_VAR_edge_limit_per_second="$edge_limit" ./scripts/deploy-shared.sh "$GATEWAY_IMAGE"

      - name: Sign in a test creator
        id: creator
        run: |
          pool=$(tofu -chdir=infra/env output -raw user_pool_id)
          client=$(tofu -chdir=infra/env output -raw user_pool_client_id)
          email="smoke-${GITHUB_RUN_ID}@example.com"
          password="Smoke-${GITHUB_RUN_ID}-$(openssl rand -hex 8)"
          aws cognito-idp admin-create-user --user-pool-id "$pool" --username "$email" --message-action SUPPRESS >/dev/null
          aws cognito-idp admin-set-user-password --user-pool-id "$pool" --username "$email" --password "$password" --permanent
          aws cognito-idp admin-add-user-to-group --user-pool-id "$pool" --username "$email" --group-name creator
          token=$(aws cognito-idp initiate-auth --client-id "$client" --auth-flow USER_PASSWORD_AUTH \
            --auth-parameters "USERNAME=$email,PASSWORD=$password" --query 'AuthenticationResult.AccessToken' --output text)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          TOKEN: ${{ steps.creator.outputs.token }}
        run: ./scripts/smoke.sh "$(tofu -chdir=infra/env output -raw api_url)"

      - name: Load test
        if: inputs.load_scale != '0'
        env:
          LOAD_SCALE: ${{ inputs.load_scale }}
        run: |
          case "$LOAD_SCALE" in (*[!0-9.]*|'') echo "load_scale must be a number" >&2; exit 1;; esac
          sudo apt-get install -y jq >/dev/null
          ./scripts/load.sh "$LOAD_SCALE"
          cat artifacts/load/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the load report
        if: always() && inputs.load_scale != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-report
          path: artifacts/load/
          if-no-files-found: ignore

      - name: Keep it up for a while
        if: inputs.keep_minutes != '0'
        env:
          KEEP_MINUTES: ${{ inputs.keep_minutes }}
        run: |
          case "$KEEP_MINUTES" in (*[!0-9]*|'') echo "keep_minutes must be a whole number" >&2; exit 1;; esac
          sleep $(( KEEP_MINUTES * 60 ))

      # The services first: they run in the shared layer's network and read its outputs.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_CAMPAIGNS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Campaigns
        if: always()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-service.sh campaigns

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_NOTIFICATIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Notifications
        if: always()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-service.sh notifications

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_PLEDGES_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Pledges
        if: always()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-service.sh pledges

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Payments
        if: always()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/destroy-payments.sh
          echo "Payments' destroy took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy
        if: always()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          tofu -chdir=infra/env init -input=false -backend-config="bucket=$STATE_BUCKET"
          ./scripts/release-payments-database.sh
          tofu -chdir=infra/env destroy -input=false -auto-approve
          echo "Destroy took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_CAMPAIGNS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Campaigns if it is left up
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-service.sh campaigns
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_NOTIFICATIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Notifications if it is left up
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-service.sh notifications
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLEDGES_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Pledges if it is left up
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-service.sh pledges
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Payments if it is left up
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-payments.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy anything left up
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          tofu -chdir=infra/env init -input=false -backend-config="bucket=$STATE_BUCKET"
          ./scripts/release-payments-database.sh
          tofu -chdir=infra/env destroy -input=false -auto-approve
