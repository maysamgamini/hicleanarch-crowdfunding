name: sandbox

# Apply the sandbox environment, deploy the current main, smoke-test it, destroy it.
# Two services, each with its own image and its own deploy role, in this order: the shared layer and the
# monolith's migration (deploy role), then Payments (Payments' role), then the monolith's rollout, then
# the smoke test through the gateway. Destroy goes the other way: Payments first, the shared layer last.
# Needs the repository variables AWS_DEPLOY_ROLE_ARN, AWS_PAYMENTS_DEPLOY_ROLE_ARN and TF_STATE_BUCKET
# (outputs of infra/bootstrap).
on:
  workflow_dispatch:
    inputs:
      keep_minutes:
        description: "Minutes to keep the environment up after the smoke test (0 = destroy at once)"
        default: "0"
      load_scale:
        description: "Run the Round 2 load profile at this fraction of the loop's rates, e.g. 0.02 (0 = no load test)"
        default: "0"
  schedule:
    - cron: "17 3 * * *" # nightly: destroy anything left up

permissions:
  id-token: write
  contents: read

concurrency:
  group: sandbox
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: inputs.load_scale != '0'

      - name: Push the monolith's images
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          api="$REGISTRY/hicleanarch/crowdfunding-api"
          gateway="$REGISTRY/hicleanarch/crowdfunding-gateway"
          ./scripts/push-image.sh "$api" "$GITHUB_SHA" Dockerfile
          ./scripts/push-image.sh "$gateway" "$GITHUB_SHA" src/Gateway/Dockerfile
          echo "image=$api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-payments
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push Payments' image, as Payments' deploy role
        id: payments-image
        env:
          REGISTRY: ${{ steps.ecr-payments.outputs.registry }}
        run: |
          repository="$REGISTRY/hicleanarch/crowdfunding-payments"
          ./scripts/push-image.sh "$repository" "$GITHUB_SHA" src/Services/Payments.Host/Dockerfile
          echo "image=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # The database must be migrated before any task runs the new image, without a targeted apply:
      # the first apply is complete but keeps the API service on the image it runs now (none in a new
      # environment, whose service the second apply creates); the second moves it to the release.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Apply the shared layer and migrate, with the API service on its current image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GATEWAY_IMAGE: ${{ steps.image.outputs.gateway }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          LOAD_SCALE: ${{ inputs.load_scale || '0' }}
        run: |
          start=$(date +%s)
          # A load run comes from this one runner, which the gateway would limit as a single client:
          # the run measures the system behind the edge, so it lifts the per-client limit.
          edge_limit=20
          if [ "$LOAD_SCALE" != "0" ]; then edge_limit=100000; fi
          # The same values for both applies (and the destroy).
          {
            echo "TF_VAR_image=$IMAGE"
            echo "TF_VAR_gateway_image=$GATEWAY_IMAGE"
            echo "TF_VAR_edge_limit_per_second=$edge_limit"
          } >> "$GITHUB_ENV"
          TF_VAR_edge_limit_per_second="$edge_limit" ./scripts/deploy-monolith.sh prepare "$IMAGE" "$GATEWAY_IMAGE"
          echo "First apply and migration took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      # Payments before the monolith's rollout: the monolith calls Payments, so the server is up before
      # its caller, and Payments' migration runs before any of its tasks takes the release.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Payments, as Payments' deploy role
        env:
          IMAGE: ${{ steps.payments-image.outputs.image }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/deploy-payments.sh "$IMAGE"
          echo "Payments' applies, migration and rollout took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll the monolith onto the new image
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/deploy-monolith.sh roll "$TF_VAR_image" "$TF_VAR_gateway_image"
          echo "Second apply and rollout took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in a test creator
        id: creator
        run: |
          pool=$(terraform -chdir=infra/env output -raw user_pool_id)
          client=$(terraform -chdir=infra/env output -raw user_pool_client_id)
          email="smoke-${GITHUB_RUN_ID}@example.com"
          password="Smoke-${GITHUB_RUN_ID}-$(openssl rand -hex 8)"
          aws cognito-idp admin-create-user --user-pool-id "$pool" --username "$email" --message-action SUPPRESS >/dev/null
          aws cognito-idp admin-set-user-password --user-pool-id "$pool" --username "$email" --password "$password" --permanent
          aws cognito-idp admin-add-user-to-group --user-pool-id "$pool" --username "$email" --group-name creator
          token=$(aws cognito-idp initiate-auth --client-id "$client" --auth-flow USER_PASSWORD_AUTH \
            --auth-parameters "USERNAME=$email,PASSWORD=$password" --query 'AuthenticationResult.AccessToken' --output text)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          TOKEN: ${{ steps.creator.outputs.token }}
        run: ./scripts/smoke.sh "$(terraform -chdir=infra/env output -raw api_url)"

      - name: Load test
        if: inputs.load_scale != '0'
        env:
          LOAD_SCALE: ${{ inputs.load_scale }}
        run: |
          case "$LOAD_SCALE" in (*[!0-9.]*|'') echo "load_scale must be a number" >&2; exit 1;; esac
          sudo apt-get install -y jq >/dev/null
          ./scripts/load.sh "$LOAD_SCALE"
          cat artifacts/load/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the load report
        if: always() && inputs.load_scale != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-report
          path: artifacts/load/
          if-no-files-found: ignore

      - name: Keep it up for a while
        if: inputs.keep_minutes != '0'
        env:
          KEEP_MINUTES: ${{ inputs.keep_minutes }}
        run: |
          case "$KEEP_MINUTES" in (*[!0-9]*|'') echo "keep_minutes must be a whole number" >&2; exit 1;; esac
          sleep $(( KEEP_MINUTES * 60 ))

      # Payments first: it runs in the shared layer's network and reads its outputs.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Payments
        if: always()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          ./scripts/destroy-payments.sh
          echo "Payments' destroy took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: always()
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy
        if: always()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          start=$(date +%s)
          terraform -chdir=infra/env init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir=infra/env destroy -input=false -auto-approve
          echo "Destroy took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy Payments if it is left up
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: ./scripts/destroy-payments.sh
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Destroy anything left up
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/env init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir=infra/env destroy -input=false -auto-approve
