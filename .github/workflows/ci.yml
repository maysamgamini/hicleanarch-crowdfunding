name: ci

on:
  push:
    branches: [main]
    tags: ["s*-l*"]
  pull_request:

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

jobs:
  # The .NET build, tests and images run in each service's pipeline (monolith.yml, payments.yml), for
  # the paths that service is built from. What runs here is cheap and checks every change: the
  # delivery rules themselves, and every OpenTofu root.
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Solution filters, project graphs, path filters and pinned actions
        run: dotnet test tests/Delivery.Tests

  # OpenTofu (MPL-2.0), the version in .opentofu-version. No credentials: init without the backend,
  # and tofu test plans each root against mock providers, so nothing here calls AWS.
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: fmt, validate and test every root
        run: |
          tofu fmt -check -recursive infra
          for dir in infra/bootstrap infra/env infra/services/payments; do
            if ls "$dir"/*.tf >/dev/null 2>&1; then
              tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly
              tofu -chdir="$dir" validate
              tofu -chdir="$dir" test
            fi
          done
