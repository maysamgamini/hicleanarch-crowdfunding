name: ci

on:
  push:
    branches: [main]
    tags: ["s*-l*"]
  pull_request:

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

jobs:
  # The .NET build, tests and images run in each service's pipeline (monolith.yml, payments.yml), for
  # the paths that service is built from. What runs here is cheap and checks every change: the
  # delivery rules themselves, and every Terraform root.
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Solution filters, project graphs, path filters and pinned actions
        run: dotnet test tests/Delivery.Tests

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: fmt, validate and test every layer that has Terraform files
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/env infra/services/payments; do
            if ls "$dir"/*.tf >/dev/null 2>&1; then
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
              # Tests against a mocked AWS provider (no account, no calls), where a layer has them.
              if [ -d "$dir/tests" ]; then
                terraform -chdir="$dir" test
              fi
            fi
          done
