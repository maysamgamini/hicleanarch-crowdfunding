name: ci

on:
  push:
    branches: [main]
    tags: ["s*-l*"]
  pull_request:

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

jobs:
  # The .NET build, tests and images run in each service's pipeline (monolith.yml, payments.yml), for
  # the paths that service is built from. What runs here is cheap and checks every change: the
  # delivery rules themselves, and every OpenTofu root.
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the BuildingBlocks version check reads every pushed commit
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Solution filters, project graphs, path filters and pinned actions
        run: dotnet test tests/Delivery.Tests
      - name: Every service host still matches the service template
        run: scripts/check-service-template.sh
      - name: Each BuildingBlocks change comes with a new version (CQA-2112)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with (a new branch or a tag): nothing to check."
            exit 0
          fi
          scripts/check-buildingblocks-version.sh "$BASE"

  # Every root under both tools the course supports: OpenTofu (MPL-2.0, the default) and Terraform
  # (BUSL-1.1), each at the version its file pins. No credentials: init without the backend, and the
  # tests plan or apply against mock providers, so nothing here calls AWS.
  infra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iac: [tofu, terraform]
    env:
      IAC: ${{ matrix.iac }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.iac == 'tofu'
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - id: terraform
        if: matrix.iac == 'terraform'
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: matrix.iac == 'terraform'
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: fmt, init, validate and test every root
        run: scripts/check-infra.sh

