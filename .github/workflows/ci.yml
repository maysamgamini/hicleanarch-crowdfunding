name: ci

on:
  push:
    branches: [main]
    tags: ["s*-l*"]
  pull_request:

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Pack the BuildingBlocks into the local feed the modules restore from
        # A clean runner: the release version itself, with no stale package cache to worry about.
        run: dotnet pack BuildingBlocks.slnx -o artifacts/packages
      - run: dotnet build CrowdFunding.slnx
      - run: dotnet test CrowdFunding.slnx --no-build
      - name: Every model change has its migration
        # EF Core 9+ refuses to migrate a model that differs from its last migration; catch it here.
        run: |
          dotnet tool restore
          for project in src/Modules/Campaigns/Campaigns.Infrastructure src/Modules/Pledges/Pledges.Infrastructure \
                         src/Modules/Payments/Payments.Infrastructure src/Modules/Notifications; do
            dotnet ef migrations has-pending-model-changes --project "$project" --no-build
          done
      - name: The image builds
        run: docker build -q -t crowdfunding-api:ci .
      - name: The gateway image builds
        run: docker build -q -f src/Gateway/Dockerfile -t crowdfunding-gateway:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: fmt and validate every layer that has Terraform files
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/env; do
            if ls "$dir"/*.tf >/dev/null 2>&1; then
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            fi
          done
