name: shared

# The shared layer's pipeline (lesson s5-l10: the monolith's pipeline is retired): the gateway built and
# tested from its solution filter, then (on main) its image pushed and, if a sandbox is up, infra/env
# applied: the network, the cluster, the database, Valkey, the broker and the gateway. Each service has its
# own pipeline (payments, notifications, campaigns, pledges). The release job runs only where a deploy role
# is set: without AWS credentials nothing tries to reach AWS.
# Path filters are not applied to tag pushes: a lesson tag runs every pipeline.
on:
  push:
    branches: [main]
    tags: ["s*-l*"]
    paths:
      - "src/Gateway/**"
      - "tests/Gateway.Tests/**"
      - "tests/Directory.Build.props"
      - "infra/env/**"
      - "infra/modules/**"
      - "Shared.slnf"
      - "CrowdFunding.slnx"
      - "BuildingBlocks.slnx"
      - "src/Platform/BuildingBlocks/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
      - ".editorconfig"
      - ".dockerignore"
      - "events/subscriptions.json"
      - "events/broker-subscriptions.json"
      - "scripts/deploy-shared.sh"
      - "scripts/hand-over.sh"
      - "scripts/run-migration.sh"
      - "scripts/push-image.sh"
      - ".github/workflows/shared.yml"
  pull_request:
    paths:
      - "src/Gateway/**"
      - "tests/Gateway.Tests/**"
      - "tests/Directory.Build.props"
      - "infra/env/**"
      - "infra/modules/**"
      - "Shared.slnf"
      - "CrowdFunding.slnx"
      - "BuildingBlocks.slnx"
      - "src/Platform/BuildingBlocks/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
      - ".editorconfig"
      - ".dockerignore"
      - "events/subscriptions.json"
      - "events/broker-subscriptions.json"
      - "scripts/deploy-shared.sh"
      - "scripts/hand-over.sh"
      - "scripts/run-migration.sh"
      - "scripts/push-image.sh"
      - ".github/workflows/shared.yml"

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test fails the job in minutes, not after GitHub's default of six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Pack the BuildingBlocks into the local feed the gateway restores from
        run: dotnet pack BuildingBlocks.slnx -o artifacts/packages
      - name: The gateway builds alone, from its solution filter
        run: dotnet build Shared.slnf
      - name: Test
        run: dotnet test Shared.slnf --no-build --blame-hang-timeout 5m
      - name: The gateway image builds
        run: docker build -q -f src/Gateway/Dockerfile -t crowdfunding-gateway:ci .

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-shared
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push the gateway's image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          gateway="$REGISTRY/hicleanarch/crowdfunding-gateway"
          ./scripts/push-image.sh "$gateway" "$GITHUB_SHA" src/Gateway/Dockerfile
          echo "gateway=$gateway:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      # The sandbox is up while its outputs document exists (infra/env/shared-outputs.tf).
      - name: Is a sandbox up?
        id: sandbox
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if aws s3api head-object --bucket "$STATE_BUCKET" --key env/shared.json >/dev/null 2>&1; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sandbox is up: the image is pushed, nothing is deployed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.sandbox.outputs.up == 'true'
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false
      - name: Deploy the shared layer and the gateway
        if: steps.sandbox.outputs.up == 'true'
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          GATEWAY_IMAGE: ${{ steps.image.outputs.gateway }}
        run: ./scripts/deploy-shared.sh "$GATEWAY_IMAGE"
