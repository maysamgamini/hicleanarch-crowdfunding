name: payments

# The Payments service's pipeline: contract tests, then Payments built and tested alone from its
# solution filter, then (on main) its image pushed with its own deploy role and, if a sandbox is up,
# Payments deployed into it. The paths are what the Payments image is built from, and the tests that
# run both services (System.slnf). Since s4-l10 src/Modules/Payments runs this pipeline only, but for
# Payments.Client, which is the monolith's; Contracts, BuildingBlocks, the subscriptions file and the
# build settings run both.
# Path filters are not applied to tag pushes: a lesson tag runs every pipeline.
on:
  push:
    branches: [main]
    tags: ["s*-l*"]
    paths:
      - "src/Services/Payments.Host/**"
      - "infra/services/payments/**"
      - "infra/env/shared-outputs.tf"
      - "infra/env/payments-network.tf"
      - "infra/env/messaging.tf"
      - "src/Modules/Payments/**"
      - "!src/Modules/Payments/Payments.Client/**"
      - "src/Modules/*/*.Contracts/**"
      - "src/BuildingBlocks/**"
      - "events/subscriptions.json"
      - "tests/Payments.UnitTests/**"
      - "tests/Directory.Build.props"
      - "Payments.slnf"
      - "System.slnf"
      - "tests/IntegrationTests/**"
      - "tests/ArchitectureTests/**"
      - "tests/Contracts.ConsumerTests/**"
      - "tests/Shared/**"
      - "Contracts.slnf"
      - "CrowdFunding.slnx"
      - "BuildingBlocks.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
      - "dotnet-tools.json"
      - ".editorconfig"
      - ".dockerignore"
      - "scripts/deploy-payments.sh"
      - "scripts/run-migration.sh"
      - "scripts/push-image.sh"
      - ".github/workflows/payments.yml"
      - "src/Messaging/**"
      - "tests/Contracts.ProducerTests/**"
      - "Contracts.slnx"
      - "events/broker-subscriptions.json"
      - "scripts/check-contracts.sh"
      - "scripts/pack-contracts.sh"
  pull_request:
    paths:
      - "src/Services/Payments.Host/**"
      - "infra/services/payments/**"
      - "infra/env/shared-outputs.tf"
      - "infra/env/payments-network.tf"
      - "infra/env/messaging.tf"
      - "src/Modules/Payments/**"
      - "!src/Modules/Payments/Payments.Client/**"
      - "src/Modules/*/*.Contracts/**"
      - "src/BuildingBlocks/**"
      - "events/subscriptions.json"
      - "tests/Payments.UnitTests/**"
      - "tests/Directory.Build.props"
      - "Payments.slnf"
      - "System.slnf"
      - "tests/IntegrationTests/**"
      - "tests/ArchitectureTests/**"
      - "tests/Contracts.ConsumerTests/**"
      - "tests/Shared/**"
      - "Contracts.slnf"
      - "CrowdFunding.slnx"
      - "BuildingBlocks.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "NuGet.config"
      - "dotnet-tools.json"
      - ".editorconfig"
      - ".dockerignore"
      - "scripts/deploy-payments.sh"
      - "scripts/run-migration.sh"
      - "scripts/push-image.sh"
      - ".github/workflows/payments.yml"
      - "src/Messaging/**"
      - "tests/Contracts.ProducerTests/**"
      - "Contracts.slnx"
      - "events/broker-subscriptions.json"
      - "scripts/check-contracts.sh"
      - "scripts/pack-contracts.sh"

# Read the code, nothing else: the default token may be read-write.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  contracts:
    # First, so a contract change that would break the other service stops before either builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet pack BuildingBlocks.slnx -o artifacts/packages
      - run: dotnet test Contracts.slnf
      - name: Contract tests, on the Contracts' source (s4-l06)
        run: dotnet test tests/Contracts.ProducerTests
      - name: A contract change since the base carries the version it needs
        # A pull request against its base branch; a push against the commit it follows. A new branch has no base.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-contracts.sh "$BASE"
          fi

  build:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet pack BuildingBlocks.slnx -o artifacts/packages
      - name: Pack the Contracts, which every module builds against as packages (s4-l06)
        run: dotnet pack Contracts.slnx -o artifacts/packages
      - name: Payments builds alone, from its solution filter
        run: dotnet build Payments.slnf
      - run: dotnet test Payments.slnf --no-build
      - name: The tests that run both services, built from this commit
        # The rule tests start the monolith and Payments.Host side by side (s4-l10): whichever service
        # changed is checked against the other at the same commit.
        run: dotnet test System.slnf
      - name: Every model change has its migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Modules/Payments/Payments.Infrastructure --no-build
      - name: The image builds
        run: docker build -q -f src/Services/Payments.Host/Dockerfile -t crowdfunding-payments:ci .

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-payments
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PAYMENTS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          repository="$REGISTRY/hicleanarch/crowdfunding-payments"
          ./scripts/push-image.sh "$repository" "$GITHUB_SHA" src/Services/Payments.Host/Dockerfile
          echo "image=$repository:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      # The sandbox is up while its outputs document exists (infra/env/shared-outputs.tf).
      - name: Is a sandbox up?
        id: sandbox
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if aws s3api head-object --bucket "$STATE_BUCKET" --key env/shared.json >/dev/null 2>&1; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sandbox is up: the image is pushed, nothing is deployed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        if: steps.sandbox.outputs.up == 'true'
        with:
          terraform_wrapper: false
      - name: Deploy Payments, and only Payments
        if: steps.sandbox.outputs.up == 'true'
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: ./scripts/deploy-payments.sh "$IMAGE"
